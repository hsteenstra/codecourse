<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code For ME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Nunito', sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 112, 184, 0.34), transparent 33%),
        radial-gradient(circle at 82% 18%, rgba(53, 212, 192, 0.28), transparent 36%),
        radial-gradient(circle at 50% 88%, rgba(139, 92, 246, 0.32), transparent 45%),
        linear-gradient(155deg, #1f1a4f, #2b2b7a 55%, #2f5aa8);
      padding: 1.2rem;
      text-align: center;
    }
    .card {
      max-width: 620px;
      border-radius: 22px;
      padding: 2rem;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 16px 40px rgba(15, 10, 44, 0.35);
    }
    h1 { margin: 0 0 .6rem; font-size: clamp(2rem, 5vw, 3rem); color: #ffd166; }
    p { margin: 0.4rem 0; font-size: 1.1rem; }
    code { background: rgba(0,0,0,.28); padding: .2rem .45rem; border-radius: 8px; }
  </style>
</head>
<body>
  <section class="card">
    <h1>Code For ME</h1>
    <p>Your repository now has a real homepage for GitHub Pages (instead of showing README).</p>
    <p>To run the full Flask app locally:</p>
    <p><code>python app.py</code> then open <code>http://127.0.0.1:5000</code>.</p>
  </section>
</body>
</html>
