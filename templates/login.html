{% extends "base.html" %}

{% block page_class %}auth-page{% endblock %}

{% block content %}
<section class="auth-shell">
    <header class="auth-header">
        <h1>Code For ME</h1>
        <p>Learn to code one quest at a time.</p>
    </header>

    <div class="auth-card">
        <div class="auth-switch" role="tablist" aria-label="Authentication options">
            <button class="switch-btn active" type="button">Log In</button>
            <button class="switch-btn" type="button">Sign Up</button>
        </div>

        <form method="post" class="auth-form">
            <input name="name" placeholder="Full Name" required>
            <input name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>

            <select name="role" required>
                <option disabled selected>Select role</option>
                <option>Student</option>
                <option>Teacher</option>
            </select>

            <button class="primary" type="submit">Start Learning</button>
        </form>
    </div>
</section>
{% endblock %}
